name: Build CLI & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN: unity_pipeline_cli

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse version (semver)
        id: parse
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z.-]+))?(\+([0-9A-Za-z.-]+))?$'
            if ! [[ "$TAG" =~ $SEMVER_RE ]]; then
              echo "::error::Tag「$TAG」不符合 semver，正确格式：v1.2.3 或 v1.2.3-beta.1"
              exit 1
            fi
            VERSION="${TAG#v}"
          else
            # 手动触发：开发版本，不校验 semver
            VERSION="0.0.0-dev.${RUN_NUMBER}"
          fi
          if [[ "$VERSION" == *-* ]]; then PRE="true"; else PRE="false"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION prerelease=$PRE"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
          - os: macos-latest
            targets: x86_64-apple-darwin aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      # tag 为准：改写 Cargo.toml 版本，保证 --version 与 Release 一致
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          sed -i.bak "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            cargo build --release --target "$t"
          done

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          for t in ${{ matrix.targets }}; do
            if [[ "$t" == *windows* ]]; then
              cp "target/$t/release/${BIN}.exe" "dist/${BIN}-${VERSION}-windows-x86_64.exe"
            else
              if [[ "$t" == aarch64* ]]; then arch=arm64; else arch=x86_64; fi
              zip -j "dist/${BIN}-${VERSION}-macos-${arch}.zip" "target/$t/release/${BIN}"
            fi
          done
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            lipo -create -output "${BIN}" \
              "target/x86_64-apple-darwin/release/${BIN}" \
              "target/aarch64-apple-darwin/release/${BIN}"
            zip -j "dist/${BIN}-${VERSION}-macos-universal.zip" "${BIN}"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/*

  release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史，供 changelog 生成用

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 自生成提交列表写进 Release 正文（generate_release_notes 只对比上一个 tag，
      # 首个 release 或无 PR 时只会给出链接，故自行生成）
      - name: Build changelog
        run: |
          PREV="$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## 更新内容"
            echo ""
            git log --no-decorate --pretty=format:"- %s" "$RANGE"
            echo ""
          } > body.md
          cat body.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: body.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
