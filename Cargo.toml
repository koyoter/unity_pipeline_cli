[package]
name = "unity_pipeline_cli"
version = "0.2.6"
edition = "2021"
# 单元测试放在 tests/{install,i18n,upgrade}.rs，由 src/ 里对应的
# #[path] 声明挂载为子模块（见各测试文件头注释）；关掉自动发现，
# 避免cargo 把这些文件当独立集成测试 crate 编译。
autotests = false

[[bin]]
name = "unity_pipeline_cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
anyhow = "1"
patchkit = "0.3"
sha1 = "0.10"
semver = "1"
# perf-assistant 扩展 zip 的解压（安装时从 codely.tuanjie.cn 下载；GNU tar
# 读不了 zip，外部 unzip 各平台不齐，纯 Rust 实现跨平台确定）
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
